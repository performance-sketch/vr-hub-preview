  <script>/* aparência: 'auto' segue o aparelho; 'claro'/'escuro' fixos (menu do usuário). Aplica antes de desenhar, sem piscar */window.vroTema=function(t){try{if(t)localStorage.setItem('vro-tema',t);t=localStorage.getItem('vro-tema')||'auto'}catch(e){t=t||'auto'}var m=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)'),esc=t==='escuro'||(t==='auto'&&m&&m.matches);document.documentElement.classList.toggle('escuro',!!esc);document.documentElement.style.colorScheme=esc?'dark':'light';return t};vroTema();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){vroTema()})}catch(e){}</script>
